name: evidence-loop-tests

on:
  pull_request:
    paths:
      - "acceptance_loop/**"
      - ".github/workflows/acceptance-loop-tests.yml"
  push:
    branches:
      - acceptance/v079p-loop
    paths:
      - "acceptance_loop/**"
      - ".github/workflows/acceptance-loop-tests.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        working-directory: acceptance_loop
        run: PYTHONPATH=src python -m unittest discover -s tests -v
