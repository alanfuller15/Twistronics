[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twistronics-acceptance-loop"
version = "0.1.0"
description = "Evidence-only bounded partner review loop"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
twistronics-acceptance-loop = "twistronics_acceptance_loop.orchestrator:main"

[tool.setuptools.packages.find]
where = ["src"]

